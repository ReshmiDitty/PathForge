{% extends 'base.html' %}

{% block title %}Create Account – PathForge{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <div class="w-12 h-12 rounded-xl bg-slate-900 text-teal-400 font-extrabold flex items-center justify-center mx-auto mb-4 text-xl shadow-md">
      PF
    </div>
    <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create your PathForge Account</h2>
    <p class="mt-2 text-xs text-slate-600">
      Start your AI-Enabled Career Guidance & Skills Intelligence Journey
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-6 shadow-xl rounded-2xl sm:px-10 border border-slate-200/80">
      <form class="space-y-4" method="POST" action="{{ url_for('auth.register') }}">
        <div>
          <label for="name" class="block text-xs font-semibold text-slate-700">Full Name</label>
          <div class="mt-1">
            <input id="name" name="name" type="text" required placeholder="Aarav Sharma" class="appearance-none block w-full px-3.5 py-2.5 border border-slate-300 rounded-xl placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 text-sm">
          </div>
        </div>

        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700">College / Personal Email</label>
          <div class="mt-1">
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="aarav@college.edu" class="appearance-none block w-full px-3.5 py-2.5 border border-slate-300 rounded-xl placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 text-sm">
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700">Password (min 6 characters)</label>
          <div class="mt-1">
            <input id="password" name="password" type="password" required placeholder="••••••••" class="appearance-none block w-full px-3.5 py-2.5 border border-slate-300 rounded-xl placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 text-sm">
          </div>
        </div>

        <div>
          <label for="confirm_password" class="block text-xs font-semibold text-slate-700">Confirm Password</label>
          <div class="mt-1">
            <input id="confirm_password" name="confirm_password" type="password" required placeholder="••••••••" class="appearance-none block w-full px-3.5 py-2.5 border border-slate-300 rounded-xl placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 text-sm">
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-teal-600 hover:bg-teal-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition">
            Create Free Account & Start Assessment
          </button>
        </div>
      </form>

      <div class="mt-6 border-t border-slate-200 pt-4 text-center text-xs text-slate-600">
        Already registered?
        <a href="{{ url_for('auth.login') }}" class="font-bold text-teal-600 hover:text-teal-700 ml-1">Sign in here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
